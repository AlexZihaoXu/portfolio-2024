version: "3"
services:
  portfolio:
    build: nginx:latest
    container_name: portfolio
    ports:
      - "82:80"
    restart: always
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
    networks:
      - npm_network

networks:
  npm_network:
    external: true
    name: nginx-proxy-manager_default